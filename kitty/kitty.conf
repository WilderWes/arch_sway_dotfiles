# Resources
    # 1) kitty faq (https://sw.kovidgoyal.net/kitty/faq/)
    # 2) unicode PUA (https://en.wikipedia.org/wiki/Private_Use_Areas)

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# FONT
font_family      family='JetBrains Mono'
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11

# NERD FONT SYMBOL FALLBACK
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Symbols Nerd Font Mono

# DISABLE LIGA
disable_ligatures always

# MISC
scrollback_pager_history_size 50
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
copy_on_select yes
sync_to_monitor yes
mouse_hide_wait -1

map ctrl+shift+n launch --type=os-window --cwd=root
map ctrl+shift+t launch --type=tab --location=neighbor --cwd=root

# TABS (https://sw.kovidgoyal.net/kitty/actions/#action-goto_tab)
tab_bar_edge top
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
